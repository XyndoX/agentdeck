<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentdeck</title>
<style>
  :root {
    --bg: #0e0e12; --panel: #16161c; --panel2: #1c1c24; --line: #262631; --line2: #31313e;
    --fg: #e4e4ea; --dim: #9a9aa8; --mute: #62626f; --accent: #a882ff; --accent2: #7c5cff;
    --ok: #7bd88f; --warn: #f5b642; --err: #f07178;
    --search: #4fb6f0; --crawl: #3ee6b4; --edit: #f5b642; --read: #8b90a6; --build: #ff8a5c; --test: #7bd88f;
    --git: #f07178; --shell: #c3a6ff; --computer: #ff5fa2; --agent: #a882ff; --mcp: #5fd7d7; --other: #6e6e7c;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font: 12px/1.4 -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding: 10px 12px 16px; min-height: 100vh;
    background: radial-gradient(900px 380px at 100% -10%, #a882ff14, transparent 60%), radial-gradient(700px 300px at -10% 110%, #3ee6b40d, transparent 60%), var(--bg); }
  .mono { font-family: var(--mono); }
  .dim { color: var(--dim); } .mute { color: var(--mute); }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 650; letter-spacing: .2px; font-size: 13px; }
  .brand svg { width: 20px; height: 20px; }
  .tabs { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 2px; margin-left: auto; }
  .tab { padding: 4px 10px; border-radius: 7px; color: var(--dim); cursor: pointer; font-weight: 550; display: flex; gap: 6px; align-items: center; }
  .tab.on { background: linear-gradient(180deg, #2a2340, #221d33); color: var(--fg); box-shadow: inset 0 0 0 1px #a882ff40; }
  .tab .n { font-size: 10px; color: var(--mute); font-family: var(--mono); }
  .tab.on .n { color: var(--accent); }
  .live { display: flex; align-items: center; gap: 5px; color: var(--mute); font-size: 10.5px; font-family: var(--mono); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px #7bd88f22; }
  .dot.busy { background: var(--accent); box-shadow: 0 0 0 3px #a882ff2a; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px #a882ff00; opacity: .65; } }

  .panel { background: linear-gradient(180deg, var(--panel), #14141a); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; margin-bottom: 9px; }
  .ph { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--dim); font-size: 10.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; }
  .ph .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--mute); }

  .title { display: flex; align-items: center; gap: 9px; margin: 2px 2px 10px; }
  .title h1 { font-size: 15px; font-weight: 650; letter-spacing: .1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title .path { color: var(--mute); font-family: var(--mono); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line2); color: var(--dim); white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
  .pill.busy, .pill.working { color: #d6c6ff; border-color: #a882ff55; background: #a882ff18; }
  .pill.done { color: var(--ok); border-color: #7bd88f40; background: #7bd88f10; }
  .pill.err, .pill.failed, .pill.blocked { color: var(--err); border-color: #f0717840; background: #f0717810; }
  .pill.waiting { color: var(--warn); border-color: #f5b64240; background: #f5b64210; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 7px; margin-bottom: 9px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; position: relative; overflow: hidden; }
  .kpi .v { font-size: 19px; font-weight: 680; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 11px; color: var(--mute); font-weight: 500; margin-left: 2px; }
  .kpi .l { color: var(--mute); font-size: 10.5px; margin-top: 1px; }
  .kpi::after { content: ""; position: absolute; inset: auto 0 0 0; height: 2px; background: var(--c, var(--accent)); opacity: .7; }

  /* agent flow */
  .tree .kids { margin-left: 15px; padding-left: 15px; position: relative; }
  .tree .kids::before { content: ""; position: absolute; left: 0; top: -6px; bottom: 22px; width: 2px; border-radius: 2px; background: var(--line2); }
  .tree .kids.hot::before { background: linear-gradient(180deg, #a882ff, #3ee6b4, #a882ff); background-size: 100% 200%; animation: flow 2.4s linear infinite; }
  @keyframes flow { to { background-position: 0 -200%; } }
  .tree .node { position: relative; margin-top: 7px; }
  .tree .kids > .node::before { content: ""; position: absolute; left: -15px; top: 21px; width: 13px; height: 2px; background: var(--line2); border-radius: 2px; }
  .tree .kids.hot > .node.working::before { background: var(--accent); box-shadow: 0 0 8px #a882ff; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px 9px; display: grid; grid-template-columns: 30px 1fr; gap: 0 9px; }
  .node.working > .card { border-color: #a882ff59; box-shadow: 0 0 0 1px #a882ff1a, 0 6px 16px -10px #000; }
  .node.done > .card { opacity: .72; }
  .av { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #a882ff1c; color: var(--accent); grid-row: span 3; }
  .av svg { width: 16px; height: 16px; }
  .node.main .av { background: linear-gradient(135deg, #a882ff, #6f4bff); color: #fff; }
  .node.working .av { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow { 50% { background: #a882ff38; } }
  .card .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .card .name { font-weight: 640; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .model { font-family: var(--mono); font-size: 10px; color: var(--mute); white-space: nowrap; }
  .card .top .pill { margin-left: auto; }
  .card .desc { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now { display: flex; align-items: center; gap: 6px; margin-top: 5px; min-width: 0; font-size: 11px; }
  .now .t { font-family: var(--mono); font-size: 10.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .el { white-space: nowrap; margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--mute); }
  .mix { display: flex; height: 4px; border-radius: 4px; overflow: hidden; margin-top: 7px; background: var(--line); gap: 1px; }
  .mix i { display: block; height: 100%; }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 4px; border-radius: 6px; font-size: 10px; font-weight: 600; white-space: nowrap; flex: none;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); }
  .chip svg { width: 11px; height: 11px; }
  .chip.live { box-shadow: 0 0 10px color-mix(in srgb, var(--c) 45%, transparent); }

  /* timeline */
  .lanes svg { width: 100%; display: block; }
  .lanes text { font: 10px var(--mono); fill: var(--mute); }

  /* feed */
  .feed .row { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; padding: 4px 0; border-top: 1px solid #ffffff08; min-width: 0; }
  .feed .row:first-child { border-top: 0; }
  .feed .row .t { font-family: var(--mono); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed .row .t .who { color: var(--mute); margin-right: 5px; }
  .feed .row .d { font-family: var(--mono); font-size: 10px; color: var(--mute); text-align: right; }
  .feed .row.err .t { color: var(--err); }
  .feed .row.open .d { color: var(--accent); }

  .legend { display: flex; flex-wrap: wrap; gap: 5px 10px; margin-top: 8px; font-size: 10.5px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend b { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .bigmix { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .bigmix i { display: block; height: 100%; border-radius: 2px; }

  .files .f { display: flex; gap: 7px; align-items: center; font-family: var(--mono); font-size: 10.5px; padding: 2px 0; min-width: 0; }
  .files .f span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .files .f .n { margin-left: auto; color: var(--mute); }

  /* global */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .sess { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; cursor: pointer; min-width: 0; }
  .sess.busy { border-color: #a882ff55; box-shadow: 0 8px 18px -12px #000; }
  .sess.me { outline: 1px dashed #a882ff70; outline-offset: 2px; }
  .sess .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .sess .nm { font-weight: 640; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .top .pill { margin-left: auto; }
  .sess .p { font-family: var(--mono); font-size: 10px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 6px; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
  .spark .b { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; height: 100%; }
  .spark .b i { display: block; border-radius: 1.5px; min-height: 2px; }
  .spark .b.empty { background: linear-gradient(180deg, transparent 85%, #ffffff0a 85%); }
  .sess .foot { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 10.5px; color: var(--dim); min-width: 0; }
  .sess .foot .t { font-family: var(--mono); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* routines */
  .rt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 9px; align-items: center; padding: 6px 0; border-top: 1px solid #ffffff08; min-width: 0; }
  .rt:first-of-type { border-top: 0; }
  .rt .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt .sub { grid-column: 2 / 4; color: var(--mute); font-size: 10.5px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt .when { font-family: var(--mono); font-size: 10.5px; color: var(--dim); white-space: nowrap; }
  .btn svg { width: 12px; height: 12px; }
  .btn { display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border-radius: 8px; background: #a882ff1f; color: #d6c6ff; border: 1px solid #a882ff55; font-weight: 600; font-size: 11px; cursor: pointer; }
  .empty { color: var(--mute); font-size: 11px; padding: 4px 0; }
  .back { cursor: pointer; color: var(--accent); font-size: 11px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a882ff"/><stop offset="1" stop-color="#3ee6b4"/></linearGradient></defs>
      <rect x="2.5" y="2.5" width="19" height="19" rx="6" stroke="url(#lg)" stroke-width="1.8"/><circle cx="8" cy="9" r="2" fill="#a882ff"/><circle cx="16" cy="9" r="2" fill="#3ee6b4"/><circle cx="12" cy="16" r="2" fill="#d6c6ff"/>
      <path d="M8 9l4 7 4-7" stroke="url(#lg)" stroke-width="1.4" opacity=".8"/></svg>
    agentdeck
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="live"><span class="dot on" id="livedot"></span><span id="clock"></span></div>
</header>
<main id="main"></main>

<script>
const VIEW = new URLSearchParams(location.search).get('view') || ''
const ICON = {
  search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
  crawl: '<circle cx="8" cy="8" r="6"/><ellipse cx="8" cy="8" rx="2.6" ry="6"/><path d="M2 8h12"/>',
  edit: '<path d="M3 13l.8-3.2L10.6 3a1.4 1.4 0 0 1 2 0l.4.4a1.4 1.4 0 0 1 0 2L6.2 12.2z"/><path d="M9.5 4.2l2.3 2.3"/>',
  read: '<path d="M4 2h5.5L13 5.5V14H4z"/><path d="M9 2v4h4M6.5 9h4M6.5 11.5h4"/>',
  build: '<path d="M8 1.8l5.6 3.1v6.2L8 14.2l-5.6-3.1V4.9z"/><path d="M2.6 5L8 8l5.4-3M8 8v6"/>',
  test: '<circle cx="8" cy="8" r="6"/><path d="M5.2 8.2l2 2 3.8-4"/>',
  git: '<circle cx="4.5" cy="3.5" r="1.6"/><circle cx="4.5" cy="12.5" r="1.6"/><circle cx="11.5" cy="5.5" r="1.6"/><path d="M4.5 5.1v5.8M11.5 7.1c0 3-7 2-7 3.8"/>',
  shell: '<rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><path d="M4.6 6.4l2 1.6-2 1.6M8.4 10h3"/>',
  computer: '<path d="M4 2.2l8.2 5.2-3.6.9 2.1 4-1.6.8-2.1-4L4 11.6z"/>',
  agent: '<rect x="2.6" y="5" width="10.8" height="8.4" rx="2.4"/><path d="M8 5V2.4"/><circle cx="8" cy="2" r=".9"/><circle cx="6" cy="9" r=".9"/><circle cx="10" cy="9" r=".9"/>',
  mcp: '<path d="M6 1.8v3.4M10 1.8v3.4M4 5.2h8v2.2a4 4 0 0 1-8 0zM8 11.4v2.8"/>',
  other: '<circle cx="8" cy="8" r="2.4"/><circle cx="8" cy="8" r="6"/>',
}
const CAT_NAME = { search: 'search', crawl: 'crawl', edit: 'edit', read: 'read', build: 'build', test: 'test', git: 'git', shell: 'shell', computer: 'computer', agent: 'agents', mcp: 'mcp', other: 'other' }
const svg = (cat, extra = '') => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICON[cat] || ICON.other}</svg>`
const chip = (cat, label, live) => `<span class="chip${live ? ' live' : ''}" style="--c:var(--${cat})">${svg(cat)}${esc(label ?? CAT_NAME[cat])}</span>`
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const ago = (t, now) => { const s = Math.max(0, Math.round((now - t) / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h` : `${Math.floor(s / 86400)}d` }
const dur = ms => ms < 1000 ? `${Math.max(0, Math.round(ms))}ms` : ms < 60e3 ? `${(ms / 1000).toFixed(ms < 10e3 ? 1 : 0)}s` : `${Math.floor(ms / 60e3)}m${String(Math.round(ms % 60e3 / 1000)).padStart(2, '0')}`
const num = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + 'k' : String(n)
const model = m => String(m || '').replace(/^claude-/, '').replace(/-(\d+)-(\d+)$/, ' $1.$2').replace(/-(\d+)$/, ' $1')

let tab = 'session', pick = null, state = null
const ui = { tab: t => { tab = t; draw() }, session: id => { pick = id; tab = 'session'; poll() }, home: () => { pick = null; poll() }, cloud: () => fetch(`/ask?view=${encodeURIComponent(VIEW)}`, { method: 'POST', body: JSON.stringify({ what: 'cloud' }) }) }
window.deck = { key: k => {
  if (k === '1') ui.tab('session'); else if (k === '2') ui.tab('global'); else if (k === '3') ui.tab('routines')
  else if (k === 'escape' || k === 'h') ui.home(); else if (k === 'tab') ui.tab({ session: 'global', global: 'routines', routines: 'session' }[tab])
} }
document.addEventListener('click', e => { const el = e.target.closest('[data-do]'); if (!el) return; const [fn, arg] = el.dataset.do.split(':'); ui[fn]?.(arg) })

// ── session ────────────────────────────────────────────────────────────────
function agentTree(s, now) {
  const kids = new Map()
  for (const a of s.agentList) if (a.parentId != null || a.type !== 'main') {
    const p = a.type === 'main' ? null : (a.parentId ?? 'main')
    if (!kids.has(p)) kids.set(p, [])
    kids.get(p).push(a)
  }
  const main = s.agentList.find(a => a.type === 'main')
  const order = list => list.sort((x, y) => (y.status === 'working') - (x.status === 'working') || y.lastAt - x.lastAt)
  const node = (a, depth) => {
    const ch = order(kids.get(a.id) || []).slice(0, 12)
    const hot = ch.some(c => c.status === 'working')
    const cur = a.current
    const total = Object.values(a.byCat).reduce((x, y) => x + y, 0) || 1
    const mix = Object.entries(a.byCat).sort((x, y) => y[1] - x[1]).map(([c, n]) => `<i style="width:${n / total * 100}%;background:var(--${c})"></i>`).join('')
    const now_ = cur
      ? `${chip(cur.cat, cur.tool, true)}<span class="t">${esc(cur.text)}</span><span class="el">${dur(now - cur.start)}</span>`
      : a.last ? `${chip(a.last.cat, a.last.tool)}<span class="t dim">${esc(a.last.text)}</span><span class="el">${ago(a.lastAt, now)} ago</span>` : `<span class="mute">no tool calls yet</span>`
    const isMain = a.type === 'main'
    return `<div class="node ${a.status}${isMain ? ' main' : ''}">
      <div class="card"><div class="av">${svg(isMain ? 'agent' : (cur?.cat ?? 'agent'))}</div>
        <div class="top"><span class="name">${esc(isMain ? 'main' : a.type.replace(/^.*:/, ''))}</span><span class="model">${esc(model(a.model))}${a.background ? ' · bg' : ''}</span><span class="pill ${a.status}">${a.status}</span></div>
        <div class="desc">${esc(isMain ? (s.cwd) : a.description || a.lastText)}</div>
        <div class="now">${now_}</div>
        <div class="mix" style="grid-column:2">${mix}</div>
      </div>
      ${ch.length ? `<div class="kids${hot ? ' hot' : ''}">${ch.map(c => node(c, depth + 1)).join('')}</div>` : ''}
    </div>`
  }
  const roots = main ? [main] : []
  return `<div class="tree">${roots.map(r => node(r, 0)).join('')}</div>`
}

function lanes(s, now) {
  const span = 5 * 60e3, x0 = now - span, W = Math.max(260, innerWidth - 48), rowH = 17, labelW = 92
  const list = s.agentList.filter(a => a.lane.length || a.status === 'working').slice(0, 10)
  if (!list.length) return `<div class="empty">quiet for the last 5 minutes</div>`
  const H = list.length * rowH + 16
  const X = t => labelW + (Math.max(t, x0) - x0) / span * (W - labelW)
  let out = ''
  for (let m = 0; m <= 5; m++) {
    const x = labelW + m / 5 * (W - labelW)
    out += `<line x1="${x}" x2="${x}" y1="0" y2="${H - 14}" stroke="#ffffff0d"/><text x="${x}" y="${H - 2}" text-anchor="${m === 5 ? 'end' : m === 0 ? 'start' : 'middle'}">${m === 5 ? 'now' : `-${5 - m}m`}</text>`
  }
  list.forEach((a, i) => {
    const y = i * rowH
    out += `<text x="0" y="${y + 12}">${esc((a.type === 'main' ? 'main' : a.type.replace(/^.*:/, '')).slice(0, 13))}</text>`
    out += `<rect x="${labelW}" y="${y + 3}" width="${W - labelW}" height="${rowH - 6}" rx="3" fill="#ffffff05"/>`
    for (const c of a.lane) {
      const x1 = X(c.start), x2 = Math.max(x1 + 3, X(c.end || now))
      out += `<rect x="${x1}" y="${y + 3}" width="${x2 - x1}" height="${rowH - 6}" rx="3" fill="var(--${c.cat})" opacity="${c.end ? .85 : 1}"${c.err ? ' stroke="var(--err)" stroke-width="2"' : ''}${!c.end ? ' filter="url(#gl)"' : ''}/>`
    }
  })
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><filter id="gl" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${out}</svg>`
}

function feed(s, now) {
  const name = id => { const a = s.agentList.find(x => x.id === id); return a ? (a.type === 'main' ? 'main' : a.type.replace(/^.*:/, '')) : id }
  return s.events.slice(0, 14).map(e => `<div class="row${e.err ? ' err' : ''}${e.end ? '' : ' open'}">${chip(e.cat, e.tool, !e.end)}<span class="t"><span class="who">${esc(name(e.agentId))}</span>${esc(e.text)}</span><span class="d">${e.end ? dur(e.end - e.start) : '● ' + dur(now - e.start)}</span></div>`).join('') || `<div class="empty">no tool calls yet</div>`
}

function workMix(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0)
  if (!total) return `<div class="empty">nothing yet</div>`
  const e = Object.entries(counts).sort((a, b) => b[1] - a[1])
  return `<div class="bigmix">${e.map(([c, n]) => `<i style="flex:${n};background:var(--${c})"></i>`).join('')}</div>
    <div class="legend">${e.map(([c, n]) => `<span><b style="background:var(--${c})"></b>${CAT_NAME[c]} <span class="mute mono">${n}</span></span>`).join('')}</div>`
}

function sessionView(st) {
  const s = st.session, now = st.now
  if (!s) return `<div class="panel"><div class="empty">This session has no transcript yet. It shows up after the first prompt.</div></div>`
  const working = s.agentList.filter(a => a.status === 'working').length
  const calls = s.agentList.reduce((n, a) => n + a.calls, 0)
  return `
  <div class="title"><span class="dot ${s.status === 'busy' ? 'busy' : ''}"></span><h1>${esc(s.name)}</h1><span class="pill ${s.status}">${s.status}</span><span class="path">${esc(s.cwd)}</span>
    ${pick && pick !== st.sessionHome ? `<span class="back" data-do="home" style="margin-left:auto">← this session</span>` : ''}</div>
  <div class="kpis">
    <div class="kpi" style="--c:var(--accent)"><div class="v">${working}<small>/ ${s.agentList.length}</small></div><div class="l">agents working</div></div>
    <div class="kpi" style="--c:var(--crawl)"><div class="v">${num(calls)}</div><div class="l">tool calls</div></div>
    <div class="kpi" style="--c:var(--edit)"><div class="v">${s.files.length}</div><div class="l">files changed</div></div>
    <div class="kpi" style="--c:var(--search)"><div class="v">${num(s.tokensOut)}</div><div class="l">output tokens</div></div>
  </div>
  <div class="panel"><div class="ph">Agent flow<span class="r">${s.agentList.length} agent${s.agentList.length === 1 ? '' : 's'}</span></div>${agentTree(s, now)}</div>
  <div class="panel lanes"><div class="ph">Timeline<span class="r">last 5 min</span></div>${lanes(s, now)}</div>
  <div class="panel feed"><div class="ph">Live activity<span class="r">newest first</span></div>${feed(s, now)}</div>
  <div class="panel"><div class="ph">Work mix</div>${workMix(s.counts)}</div>
  ${s.files.length ? `<div class="panel files"><div class="ph">Files touched<span class="r">${s.files.length}</span></div>${s.files.slice(0, 10).map(f => `<div class="f">${chip('edit', null)}<span>${esc(f.path)}</span><span class="n">×${f.n} · ${ago(f.at, now)}</span></div>`).join('')}</div>` : ''}`
}

// ── global ─────────────────────────────────────────────────────────────────
function sparkBars(bins) {
  const max = Math.max(1, ...bins.map(b => Object.values(b).reduce((x, y) => x + y, 0)))
  return `<div class="spark">${bins.map(b => {
    const e = Object.entries(b)
    if (!e.length) return `<div class="b empty"></div>`
    return `<div class="b">${e.map(([c, n]) => `<i style="height:${n / max * 100}%;background:var(--${c})"></i>`).join('')}</div>`
  }).join('')}</div>`
}

function globalView(st) {
  const now = st.now, ss = st.sessions
  const busy = ss.filter(s => s.status === 'busy').length
  const working = ss.reduce((n, s) => n + s.active, 0)
  const toks = ss.reduce((n, s) => n + s.tokensOut, 0)
  return `
  <div class="kpis">
    <div class="kpi" style="--c:var(--ok)"><div class="v">${ss.length}</div><div class="l">sessions live</div></div>
    <div class="kpi" style="--c:var(--accent)"><div class="v">${busy}</div><div class="l">busy now</div></div>
    <div class="kpi" style="--c:var(--crawl)"><div class="v">${working}</div><div class="l">agents working</div></div>
    <div class="kpi" style="--c:var(--search)"><div class="v">${num(toks)}</div><div class="l">output tokens</div></div>
  </div>
  <div class="grid">${ss.map(s => `
    <div class="sess ${s.status}${s.id === st.home ? ' me' : ''}" data-do="session:${s.id}">
      <div class="top"><span class="dot ${s.status === 'busy' ? 'busy' : ''}"></span><span class="nm">${esc(s.name)}</span><span class="pill ${s.status}">${s.kind === 'bg' ? 'bg · ' : ''}${s.status}</span></div>
      <div class="p">${esc(s.cwd)}</div>
      ${sparkBars(s.spark)}
      <div class="foot">${s.current ? chip(s.current.cat, s.current.tool, true) + `<span class="t">${esc(s.current.text)}</span>` : `<span class="mute">${s.lastAt ? 'last activity ' + ago(s.lastAt, now) + ' ago' : 'no activity yet'}</span>`}
        <span style="margin-left:auto;white-space:nowrap" class="mute mono">${s.active}/${s.agents} agents</span></div>
    </div>`).join('')}</div>`
}

// ── routines ───────────────────────────────────────────────────────────────
const stDot = ok => `<span class="dot ${ok === true ? 'on' : ok === 'busy' ? 'busy' : ''}" ${ok === false ? 'style="background:var(--err)"' : ''}></span>`

function routinesView(st) {
  const r = st.routines, now = st.now
  const cloud = r.cloud
  const cloudRows = cloud?.items?.length
    ? cloud.items.map(t => `<div class="rt">${stDot(t.enabled !== false ? true : null)}<span class="nm">${esc(t.name)}</span><span class="when">${esc(t.schedule || '')}</span><span class="sub">${esc(t.detail || '')}</span></div>`).join('')
    : `<div class="empty">${cloud?.error ? esc(cloud.error) : cloud ? 'no cloud routines' : 'not loaded'}</div>`
  return `
  <div class="kpis">
    <div class="kpi" style="--c:var(--accent)"><div class="v">${cloud?.items?.length ?? '–'}</div><div class="l">cloud routines</div></div>
    <div class="kpi" style="--c:var(--crawl)"><div class="v">${r.crons.length}</div><div class="l">session loops</div></div>
    <div class="kpi" style="--c:var(--warn)"><div class="v">${r.jobs.filter(j => j.live).length}</div><div class="l">background jobs</div></div>
    <div class="kpi" style="--c:var(--ok)"><div class="v">${r.launchd.length}</div><div class="l">launchd jobs</div></div>
  </div>
  <div class="panel"><div class="ph">Claude cloud routines<span class="r">${cloud?.at ? 'loaded ' + ago(cloud.at, now) + ' ago · ' : ''}<span class="btn" data-do="cloud">${svg('crawl')}refresh</span></span></div>${cloudRows}</div>
  <div class="panel"><div class="ph">Session loops &amp; crons<span class="r">/loop, CronCreate</span></div>
    ${r.crons.map(c => `<div class="rt">${stDot(true)}<span class="nm">${esc(c.prompt || c.id)}</span><span class="when">${esc(c.schedule || '')}</span><span class="sub">${esc(c.session)}${c.recurring === false ? ' · once' : ''}</span></div>`).join('') || `<div class="empty">no loops in the sessions with an open deck</div>`}</div>
  <div class="panel"><div class="ph">Background jobs<span class="r">claude --bg</span></div>
    ${r.jobs.slice(0, 12).map(j => `<div class="rt">${stDot(j.state === 'blocked' ? false : j.live ? (j.state === 'running' ? 'busy' : true) : null)}<span class="nm">${esc(j.name)}</span><span class="when"><span class="pill ${j.state}">${esc(j.state)}</span></span><span class="sub">${esc(j.needs ? 'needs: ' + j.needs : j.detail)} · ${ago(j.at, now)} ago</span></div>`).join('') || `<div class="empty">none</div>`}</div>
  <div class="panel"><div class="ph">Scheduled tasks<span class="r">~/.claude/scheduled-tasks</span></div>
    ${r.scheduled.map(t => `<div class="rt">${stDot(true)}<span class="nm">${esc(t.name)}</span><span class="when"></span><span class="sub">${esc(t.description)}</span></div>`).join('') || `<div class="empty">none</div>`}</div>
  <div class="panel"><div class="ph">launchd jobs<span class="r">~/Library/LaunchAgents</span></div>
    ${r.launchd.map(j => `<div class="rt">${stDot(j.running ? 'busy' : !j.loaded ? null : j.lastExit === 0)}<span class="nm">${esc(j.label)}</span><span class="when">${esc(j.schedule)}</span><span class="sub">${j.loaded ? j.running ? 'running' : `last exit ${j.lastExit}` : 'not loaded'}${j.log ? ' · ' + esc(j.log) : ''}</span></div>`).join('') || `<div class="empty">none of your own</div>`}</div>`
}

// ── loop ───────────────────────────────────────────────────────────────────
let last = {}
function set(id, html) { if (last[id] !== html) { last[id] = html; document.getElementById(id).innerHTML = html } }

function draw() {
  if (!state) return
  const busy = state.sessions.filter(s => s.status === 'busy').length
  set('tabs', [['session', 'Session', state.session?.agentList.filter(a => a.status === 'working').length ?? 0], ['global', 'Global', state.sessions.length], ['routines', 'Routines', state.routines.jobs.filter(j => j.live).length + state.routines.launchd.length + state.routines.crons.length]]
    .map(([id, label, n]) => `<div class="tab${tab === id ? ' on' : ''}" data-do="tab:${id}">${label}<span class="n">${n}</span></div>`).join(''))
  const d = new Date(state.now)
  set('clock', `${busy} busy · ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`)
  set('main', tab === 'global' ? globalView(state) : tab === 'routines' ? routinesView(state) : sessionView(state))
}

let home = null
async function poll() {
  try {
    const r = await fetch(`/api/state?view=${encodeURIComponent(VIEW)}${pick ? `&session=${encodeURIComponent(pick)}` : ''}`)
    const st = await r.json()
    if (!pick) home = st.sessionId
    st.home = home
    st.sessionHome = home
    state = st
    document.getElementById('livedot').className = 'dot on'
  } catch { document.getElementById('livedot').className = 'dot' }
  draw()
}
poll()
setInterval(poll, 1000)
</script>
</body>
</html>
